<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#35821;&#38899;&#25968;&#23383;&#20154;&#23545;&#35805;</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202124;
            --muted: #5f6368;
            --line: #d7dce2;
            --panel: #ffffff;
            --accent: #0b7fab;
            --danger: #b3261e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background: #f6f8fa;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        header img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            gap: 20px;
            padding: 20px;
        }

        .stage,
        .side {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .stage {
            padding: 16px;
        }

        video {
            display: block;
            width: 100%;
            max-height: calc(100vh - 180px);
            background: #111;
            border-radius: 8px;
        }

        audio {
            width: 100%;
            margin-top: 12px;
        }

        .side {
            display: flex;
            flex-direction: column;
            min-height: 520px;
            max-height: calc(100vh - 140px);
            overflow: hidden;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }

        button {
            min-height: 42px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button.secondary {
            background: #fff;
            color: var(--accent);
        }

        button.danger {
            border-color: var(--danger);
            background: var(--danger);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .status {
            display: grid;
            gap: 8px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
        }

        .status strong {
            color: var(--ink);
        }

        .messages {
            flex: 1;
            min-height: 0;
            max-height: 380px;
            overflow: auto;
            padding: 14px;
            overscroll-behavior: contain;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user {
            border-color: #a8d5e5;
            background: #eef8fb;
        }

        .message.assistant {
            border-color: #b7dfc2;
            background: #f1fbf4;
        }

        form {
            display: grid;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid var(--line);
        }

        textarea {
            width: 100%;
            min-height: 86px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            font: inherit;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }

            .side {
                min-height: 420px;
                max-height: none;
            }

            .messages {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="/assets/LiveTalking-logo.jpg" alt="LiveTalking" />
        <div>
            <h1>&#35821;&#38899;&#25968;&#23383;&#20154;&#23545;&#35805;</h1>
            <p>&#36830;&#25509;&#25968;&#23383;&#20154;&#21518;&#24320;&#21551;&#40614;&#20811;&#39118;&#65292;&#35828;&#23436;&#20572;&#39039;&#32422; 1 &#31186;&#20250;&#33258;&#21160;&#35782;&#21035;&#24182;&#22238;&#22797;&#12290;</p>
        </div>
    </header>

    <main>
        <section class="stage">
            <video id="video" autoplay playsinline></video>
            <audio id="audio" autoplay></audio>
        </section>

        <aside class="side">
            <div class="controls">
                <button id="start" type="button">&#36830;&#25509;&#25968;&#23383;&#20154;</button>
                <button id="stop" type="button" class="danger" style="display:none">&#26029;&#24320;&#36830;&#25509;</button>
                <button id="voice-start" type="button" disabled>&#24320;&#21551;&#40614;&#20811;&#39118;</button>
                <button id="voice-stop" type="button" class="secondary" disabled>&#20851;&#38381;&#40614;&#20811;&#39118;</button>
            </div>

            <div class="status">
                <div>&#36830;&#25509;&#29366;&#24577;&#65306;<strong id="connection-status">&#26410;&#36830;&#25509;</strong></div>
                <div>&#35821;&#38899;&#29366;&#24577;&#65306;<strong id="voice-status">&#26410;&#24320;&#21551;</strong></div>
                <div>&#20250;&#35805; ID&#65306;<strong id="session-label">0</strong></div>
            </div>

            <div class="messages" id="messages"></div>

            <form id="text-form">
                <textarea id="text-message" placeholder="&#20063;&#21487;&#20197;&#22312;&#36825;&#37324;&#36755;&#20837;&#25991;&#23383;&#27979;&#35797;&#23545;&#35805;"></textarea>
                <button type="submit">&#21457;&#36865;&#25991;&#23383;</button>
            </form>
        </aside>
    </main>

    <input type="hidden" id="sessionid" value="0" />

    <script>
        let pc = null;
        let voiceWs = null;
        let audioContext = null;
        let processor = null;
        let micSource = null;
        let micStream = null;
        let voiceEnabled = false;
        let currentAssistantMessage = null;
        let shouldStayConnected = false;
        let reconnectTimer = null;
        let reconnectAttempts = 0;
        let isConnecting = false;
        let reconnecting = false;
        let resumeVoiceAfterReconnect = false;

        const messages = document.getElementById("messages");
        const voiceStatus = document.getElementById("voice-status");
        const connectionStatus = document.getElementById("connection-status");
        const sessionLabel = document.getElementById("session-label");
        const voiceStartBtn = document.getElementById("voice-start");
        const voiceStopBtn = document.getElementById("voice-stop");
        const startBtn = document.getElementById("start");
        const stopBtn = document.getElementById("stop");

        function addMessage(text, type) {
            const item = document.createElement("div");
            item.className = "message " + (type || "system");
            item.textContent = text;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
            return item;
        }

        function appendAssistantChunk(text) {
            if (!currentAssistantMessage) {
                currentAssistantMessage = addMessage("数字人：" + text, "assistant");
            } else {
                currentAssistantMessage.textContent += text;
                messages.scrollTop = messages.scrollHeight;
            }
        }

        function setConnectionStatus(text) {
            connectionStatus.textContent = text;
        }

        function setVoiceStatus(text) {
            voiceStatus.textContent = text;
        }

        function setConnectedButtons(connected) {
            startBtn.style.display = connected ? "none" : "inline-block";
            stopBtn.style.display = connected ? "inline-block" : "none";
            voiceStartBtn.disabled = !connected || voiceEnabled;
            voiceStopBtn.disabled = !voiceEnabled;
        }

        function getMicrophoneStream(constraints) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                return navigator.mediaDevices.getUserMedia(constraints);
            }

            const legacyGetUserMedia = navigator.getUserMedia
                || navigator.webkitGetUserMedia
                || navigator.mozGetUserMedia
                || navigator.msGetUserMedia;

            if (legacyGetUserMedia) {
                return new Promise((resolve, reject) => {
                    legacyGetUserMedia.call(navigator, constraints, resolve, reject);
                });
            }

            const secureTip = window.isSecureContext
                ? "当前浏览器不支持麦克风采集。"
                : "当前页面不是安全上下文。请使用 HTTPS 或 localhost 访问。";
            return Promise.reject(new Error("无法访问麦克风。" + secureTip));
        }

        function downsample(input, inputRate, targetRate) {
            if (inputRate === targetRate) {
                return input;
            }
            const ratio = inputRate / targetRate;
            const outputLength = Math.floor(input.length / ratio);
            const output = new Float32Array(outputLength);
            for (let i = 0; i < outputLength; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(Math.floor((i + 1) * ratio), input.length);
                let sum = 0;
                let count = 0;
                for (let j = start; j < end; j++) {
                    sum += input[j];
                    count++;
                }
                output[i] = count > 0 ? sum / count : 0;
            }
            return output;
        }

        function floatToInt16(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            return output;
        }

        async function waitForIceGatheringComplete(peer) {
            if (peer.iceGatheringState === "complete") {
                return;
            }
            await new Promise((resolve) => {
                const checkState = () => {
                    if (peer.iceGatheringState === "complete") {
                        peer.removeEventListener("icegatheringstatechange", checkState);
                        resolve();
                    }
                };
                peer.addEventListener("icegatheringstatechange", checkState);
            });
        }

        async function negotiatePeer(peer) {
            peer.addTransceiver("video", { direction: "recvonly" });
            peer.addTransceiver("audio", { direction: "recvonly" });
            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);
            await waitForIceGatheringComplete(peer);

            const response = await fetch("/offer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sdp: peer.localDescription.sdp,
                    type: peer.localDescription.type
                })
            });
            const answer = await response.json();
            if (!response.ok || !answer.sdp) {
                throw new Error(answer.msg || "创建数字人会话失败。");
            }
            document.getElementById("sessionid").value = answer.sessionid;
            sessionLabel.textContent = String(answer.sessionid);
            await peer.setRemoteDescription(answer);
            return answer.sessionid;
        }

        function closePeer() {
            if (pc) {
                try {
                    pc.onconnectionstatechange = null;
                    pc.oniceconnectionstatechange = null;
                    pc.close();
                } catch (error) {
                    console.warn("close peer failed", error);
                }
                pc = null;
            }
        }

        async function connectDigitalHuman(autoReconnect = false) {
            if (isConnecting) {
                return parseInt(document.getElementById("sessionid").value || "0", 10);
            }
            isConnecting = true;
            reconnecting = autoReconnect;
            clearTimeout(reconnectTimer);
            reconnectTimer = null;

            const wasVoiceEnabled = voiceEnabled || resumeVoiceAfterReconnect;
            resumeVoiceAfterReconnect = false;
            if (autoReconnect) {
                await stopVoice();
            }
            closePeer();
            document.getElementById("sessionid").value = "0";
            sessionLabel.textContent = "0";

            try {
                setConnectionStatus(autoReconnect ? "重连中" : "连接中");
                setConnectedButtons(false);
                shouldStayConnected = true;

                pc = new RTCPeerConnection({ sdpSemantics: "unified-plan" });
                pc.addEventListener("track", (event) => {
                    if (event.track.kind === "video") {
                        document.getElementById("video").srcObject = event.streams[0];
                    } else {
                        document.getElementById("audio").srcObject = event.streams[0];
                    }
                });

                const handlePeerState = () => {
                    if (!pc) {
                        return;
                    }
                    const state = pc.connectionState || pc.iceConnectionState;
                    if (state === "connected") {
                        reconnectAttempts = 0;
                        setConnectionStatus("已连接");
                    } else if (state === "failed" || state === "disconnected" || state === "closed") {
                        if (shouldStayConnected && !isConnecting) {
                            scheduleReconnect();
                        }
                    }
                };
                pc.onconnectionstatechange = handlePeerState;
                pc.oniceconnectionstatechange = handlePeerState;

                const sessionid = await negotiatePeer(pc);
                reconnectAttempts = 0;
                setConnectionStatus("已连接");
                setConnectedButtons(true);
                addMessage(autoReconnect ? "数字人已重连。" : "数字人已连接，可以开启麦克风。", "system");
                if (wasVoiceEnabled) {
                    await startVoice(sessionid);
                }
                return sessionid;
            } catch (error) {
                closePeer();
                resumeVoiceAfterReconnect = wasVoiceEnabled;
                setConnectionStatus(autoReconnect ? "重连失败" : "连接失败");
                setConnectedButtons(false);
                addMessage(error.message, "system");
                if (shouldStayConnected) {
                    scheduleReconnect();
                }
                throw error;
            } finally {
                isConnecting = false;
                reconnecting = false;
            }
        }

        function scheduleReconnect(restartVoice = voiceEnabled) {
            if (!shouldStayConnected || reconnectTimer || reconnecting) {
                return;
            }
            resumeVoiceAfterReconnect = resumeVoiceAfterReconnect || restartVoice;
            reconnectAttempts += 1;
            const delay = Math.min(1000 * reconnectAttempts, 5000);
            setConnectionStatus("已断开，" + Math.round(delay / 1000) + " 秒后重连");
            addMessage("数字人连接已断开，正在自动重连。", "system");
            reconnectTimer = setTimeout(async () => {
                reconnectTimer = null;
                try {
                    await connectDigitalHuman(true);
                } catch (error) {
                    console.warn("auto reconnect failed", error);
                }
            }, delay);
        }

        async function disconnectDigitalHuman() {
            shouldStayConnected = false;
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
            await stopVoice();
            closePeer();
            document.getElementById("sessionid").value = "0";
            sessionLabel.textContent = "0";
            setConnectionStatus("未连接");
            setConnectedButtons(false);
        }

        async function startVoice(sessionid) {
            if (voiceEnabled) {
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            voiceWs = new WebSocket(protocol + "://" + window.location.host + "/ws/audio?sessionid=" + sessionid);
            voiceWs.binaryType = "arraybuffer";

            voiceWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "ready") {
                    setVoiceStatus("语音服务已连接");
                } else if (data.type === "speech_start") {
                    setVoiceStatus("正在聆听");
                } else if (data.type === "speech_end") {
                    setVoiceStatus("正在识别");
                } else if (data.type === "asr") {
                    currentAssistantMessage = null;
                    addMessage("我：" + data.text, "user");
                    setVoiceStatus("正在思考");
                } else if (data.type === "answer_chunk") {
                    appendAssistantChunk(data.text);
                    setVoiceStatus("数字人回复中");
                } else if (data.type === "done") {
                    currentAssistantMessage = null;
                    setVoiceStatus("等待说话");
                } else if (data.type === "asr_empty") {
                    setVoiceStatus("未识别到有效语音");
                } else if (data.type === "error") {
                    addMessage("错误：" + data.message, "system");
                    setVoiceStatus("语音服务异常");
                } else if (data.type === "session_lost") {
                    addMessage("数字人会话已断开，正在自动重连。", "system");
                    setVoiceStatus("会话已断开");
                    const restartVoice = voiceEnabled;
                    stopVoice();
                    scheduleReconnect(restartVoice);
                }
            };

            voiceWs.onclose = () => {
                if (voiceEnabled && shouldStayConnected) {
                    setVoiceStatus("语音连接已关闭");
                    scheduleReconnect(true);
                }
            };

            await new Promise((resolve, reject) => {
                voiceWs.onopen = resolve;
                voiceWs.onerror = () => reject(new Error("语音 WebSocket 连接失败。"));
            });

            micStream = await getMicrophoneStream({
                audio: {
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            micSource = audioContext.createMediaStreamSource(micStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (event) => {
                if (!voiceEnabled || !voiceWs || voiceWs.readyState !== WebSocket.OPEN) {
                    return;
                }
                const input = event.inputBuffer.getChannelData(0);
                const pcm16k = downsample(input, audioContext.sampleRate, 16000);
                const pcm16 = floatToInt16(pcm16k);
                voiceWs.send(pcm16.buffer);
            };

            micSource.connect(processor);
            processor.connect(audioContext.destination);
            voiceEnabled = true;
            setConnectedButtons(true);
            setVoiceStatus("等待说话");
        }

        async function stopVoice() {
            const ws = voiceWs;
            voiceEnabled = false;
            voiceWs = null;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "stop" }));
                ws.close();
            }
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (micSource) {
                micSource.disconnect();
                micSource = null;
            }
            if (micStream) {
                micStream.getTracks().forEach((track) => track.stop());
                micStream = null;
            }
            if (audioContext) {
                await audioContext.close();
                audioContext = null;
            }
            setConnectedButtons(parseInt(document.getElementById("sessionid").value || "0", 10) > 0);
            setVoiceStatus("未开启");
        }

        startBtn.addEventListener("click", async () => {
            try {
                const sessionid = await connectDigitalHuman(false);
                await startVoice(sessionid);
            } catch (error) {
                setConnectionStatus("连接失败");
                addMessage(error.message, "system");
                setVoiceStatus("麦克风未开启");
            }
        });

        stopBtn.addEventListener("click", async () => {
            await disconnectDigitalHuman();
        });

        voiceStartBtn.addEventListener("click", async () => {
            const sessionid = parseInt(document.getElementById("sessionid").value || "0", 10);
            if (sessionid > 0) {
                try {
                    await startVoice(sessionid);
                } catch (error) {
                    addMessage(error.message, "system");
                    setVoiceStatus("麦克风未开启");
                }
            }
        });

        voiceStopBtn.addEventListener("click", stopVoice);

        document.getElementById("text-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const textArea = document.getElementById("text-message");
            const text = textArea.value.trim();
            const sessionid = parseInt(document.getElementById("sessionid").value || "0", 10);
            if (!text || sessionid <= 0) {
                return;
            }
            currentAssistantMessage = null;
            addMessage("我：" + text, "user");
            textArea.value = "";
            await fetch("/human", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    text,
                    type: "chat",
                    interrupt: true,
                    sessionid
                })
            });
        });

        window.addEventListener("beforeunload", () => {
            shouldStayConnected = false;
            if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
                voiceWs.close();
            }
            closePeer();
        });

        setConnectedButtons(false);
    </script>
</body>
</html>
